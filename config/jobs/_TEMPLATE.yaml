# 새 고객사 납품용 템플릿. 이 파일을 config/jobs/<고객사약칭>.yaml로 복사해서
# 아래 5곳만 채우면 된다. (파일명이 잡 이름이 되고, 앞에 _가 붙은 파일은 로드되지 않는다)
#
#   1) title          - 고객이 텔레그램에서 보게 될 이름
#   2) schedule.times - 고객이 보고를 받고 싶은 현지 시각
#   3) source         - 수집할 곳 (google_sheet / rss / http_json / static)
#   4) prompt         - 고객 업무 맥락 (여기가 납품의 90%다)
#   5) sinks          - 받을 채널 (환경변수 '이름'만 적는다. 토큰은 Actions Secrets에)
#   필수 client_id   - 고객 식별자. 전용 시크릿 BASE__CLIENT_ID를 .env/Actions env 양쪽에 선언
#                     없으면 BASE 공용 값으로 폴백하므로 botkit validate 출력에서 확인

title: "고객사명 - 업무 요약 봇"
client_id: ACME  # 필수: 고객별 대문자 식별자. 시크릿은 BASE__ACME 우선, 없으면 BASE
enabled: true

# 선택: 기본값으로도 이력/비용이 기록된다. 고객별 Python 수정은 필요 없다.
history:
  enabled: true
  directory: ".botkit/history"          # 다중 고객은 .botkit/ACME/history 등으로 명시 가능
  pricing_file: "config/pricing.yaml"   # 플랫폼 공통 단가표

schedule:
  timezone: "Asia/Seoul"
  times: ["08:00"]
  # weekdays: [mon, tue, wed, thu, fri]   # 생략하면 매일

source:
  type: rss
  feeds:
    - "https://news.google.com/rss/search?q=%EA%B2%80%EC%83%89%EC%96%B4&hl=ko&gl=KR&ceid=KR:ko"
  since_hours: 24
  limit: 20

prompt:
  model: "claude-opus-5"
  system: |
    당신은 고객사의 업무를 대신 정리해주는 분석 담당자입니다.
    - 데이터에 없는 내용은 절대 추측해서 쓰지 않습니다.
    - 결론부터 쓰고, 근거를 뒤에 붙입니다.
    - 텔레그램에서 읽기 좋게 짧은 문단과 불릿으로 씁니다.
  user_template: |
    다음은 {date} 기준으로 수집한 {row_count}건의 원본 데이터입니다.

    {rows}

    위 내용을 다음 형식으로 정리해주세요.
    1) 오늘의 핵심 3줄
    2) 항목별 요약 (제목 - 한 줄 요약 - 링크)
    3) 담당자가 오늘 할 일 제안 1~2개

sinks:
  - type: telegram
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    header: "[{job_title}] {date} {time}"
