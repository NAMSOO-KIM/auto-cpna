# CS 담당자용: 구글 스프레드시트에 쌓인 '답변 미작성' 문의만 골라 답변 초안을 만들어
# 텔레그램으로 보낸다. 담당자는 초안을 복사해 시트에 붙이기만 하면 된다.
#
# 시트 준비 (고객 온보딩 때 같이 진행):
#   A: 접수일시 / B: 고객명 / C: 문의내용 / D: 답변초안(비워둠) / E: 처리상태
#   공유 설정 -> "링크가 있는 모든 사용자 - 뷰어"
title: "CS 문의 답변 초안"
client_id: ACME
enabled: false

schedule:
  timezone: "Asia/Seoul"
  times: ["09:30", "14:00", "17:30"]
  weekdays: [mon, tue, wed, thu, fri]

source:
  type: google_sheet
  sheet_id: "여기에_스프레드시트_ID"   # /d/ 와 /edit 사이의 문자열
  sheet_name: "문의접수"
  where_empty: ["답변초안"]           # 아직 답변이 없는 행만
  limit: 15

prompt:
  model: "claude-opus-5"
  max_tokens: 16000
  system: |
    당신은 온라인 쇼핑몰의 CS 담당자입니다. 아래 응대 매뉴얼을 그대로 따릅니다.

    [응대 매뉴얼]
    - 배송 문의: 주문 후 2~3일(주말/공휴일 제외) 출고, 출고 시 문자 발송됨을 안내한다.
    - 교환/반품: 수령 후 7일 이내 가능, 단순 변심은 왕복 배송비 6,000원 고객 부담.
    - 제품 하자: 사진을 요청하고, 확인 즉시 무료 재발송 또는 전액 환불을 안내한다.
    - 재고/입고 문의: 정확한 입고일은 약속하지 않고 "입고 시 알림 신청" 안내로 연결한다.

    [작성 규칙]
    - 존댓말, 3~5문장. 사과 -> 사실 안내 -> 다음 행동 순서.
    - 매뉴얼에 없는 내용(할인, 보상, 일정 확약)은 절대 약속하지 않고 "확인 후 안내드리겠습니다"로 처리한다.
    - 매뉴얼로 판단이 안 되는 문의는 초안 대신 "담당자 확인 필요"와 그 이유를 쓴다.
  user_template: |
    아래는 {date} 기준 답변이 작성되지 않은 문의 {row_count}건입니다.

    {rows}

    각 문의에 대해 다음 형식으로 답변 초안을 작성해주세요.

    ---
    시트 {_row}행 / 고객명
    (답변 초안 본문)
    ---

    문의마다 위 블록을 반복하고, 다른 설명은 붙이지 마세요.

sinks:
  - type: telegram
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    header: "[CS 답변 초안] {date} {time}"
