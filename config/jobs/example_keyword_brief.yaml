# 마케터용: 담당 키워드의 최신 뉴스/블로그를 매일 아침 8시에 인사이트로 요약.
# 구글 뉴스 검색 RSS는 키워드만 URL 인코딩해서 갈아끼우면 되므로 납품이 가장 빠르다.
title: "브랜드 키워드 모닝 브리핑"
client_id: ACME
enabled: false   # 예시 파일이라 꺼둠. 실제 납품 시 복사해서 true로.

schedule:
  timezone: "Asia/Seoul"
  times: ["08:00"]
  weekdays: [mon, tue, wed, thu, fri]

source:
  type: rss
  feeds:
    # q= 뒤의 값만 고객 키워드로 바꾼다 (예: %EB%8B%A8%EB%B0%B1%EB%B3%B4%EC%B6%A9%EC%A0%9C = 단백보충제)
    - "https://news.google.com/rss/search?q=%EB%8B%A8%EB%B0%B1%EB%B3%B4%EC%B6%A9%EC%A0%9C&hl=ko&gl=KR&ceid=KR:ko"
    - "https://news.google.com/rss/search?q=%ED%81%B4%EB%A6%B0%EB%9D%BC%EB%B2%A8&hl=ko&gl=KR&ceid=KR:ko"
  since_hours: 24
  limit: 25
  summary_chars: 300

prompt:
  model: "claude-opus-5"
  system: |
    당신은 건강기능식품 브랜드의 마케팅 전략 담당자입니다.
    담당자가 출근길 3분 안에 읽을 브리핑을 씁니다.

    규칙:
    - 기사 제목을 그대로 나열하는 '목록'은 쓰지 않습니다. 반드시 '그래서 우리가 무엇을 해야 하는가'로 연결합니다.
    - 수집된 기사에 없는 수치나 사실을 만들어내지 않습니다. 근거가 약하면 "확인 필요"라고 적습니다.
    - 텔레그램에서 읽으므로 한 문단은 3줄 이내로 짧게 씁니다. 마크다운 서식(*, _)은 쓰지 않습니다.
  user_template: |
    오늘은 {date}입니다. 아래는 지난 24시간 동안 수집된 {row_count}건의 기사입니다.

    {rows}

    다음 형식으로 브리핑을 작성해주세요.

    [오늘의 한 줄]
    가장 중요한 변화 한 문장.

    [주목할 흐름 2~3개]
    각 항목: 무슨 일인지 / 우리 브랜드에 주는 의미 / 참고 링크

    [오늘 제안하는 액션]
    콘텐츠 주제나 광고 소재 아이디어 1~2개. 실행 가능한 수준으로 구체적으로.

sinks:
  - type: telegram
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    header: "[모닝 브리핑] {date}"
