# 공통 규칙 - 모든 채널 생성 시 강제 주입
# 제휴 고지 문구는 상품마다 다르므로(쿠팡파트너스/네이버 쇼핑커넥트 등) 여기 고정 문구를
# 두지 않고, 사용자 프롬프트에 content_gen/base.py의 disclosure_text()가 상품별로 채워 넣는다.
common_rules:
  - "사용자 프롬프트에 포함된 제휴 고지 문구를 본문에 반드시 그대로 포함한다"
  - "허위·과장 효능 표현 금지"
  - "가격/할인율은 실제 데이터에 있는 값만 사용, 추측 금지"
