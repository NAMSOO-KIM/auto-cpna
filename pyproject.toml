[project]
name = "autocpna"
version = "0.1.0"
description = "AI-based social commerce content pipeline (Coupang Partners + Naver, semi-automated)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    # DATABASE_URL을 Postgres로 지정할 수 있다고 문서화해 뒀지만 드라이버가
    # 없으면 연결 시점에 ModuleNotFoundError로 죽는다.
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
    "ruff>=0.15.0",
]

[project.scripts]
autocpna = "autocpna.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
